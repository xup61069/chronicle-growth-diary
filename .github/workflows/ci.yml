name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint formatting
        run: pnpm lint
      - name: Scan tracked files and Git history for secrets
        run: pnpm verify:secrets
      - name: Type check
        run: pnpm check
      - name: Run unit tests
        run: pnpm test
      - name: Run mock OAuth provider callback smoke
        run: pnpm test:e2e:oauth-mock
      - name: Build production bundle
        run: pnpm build
      - name: Verify production lazy-route chunks
        run: pnpm verify:lazy-routes

  public-homepage-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run public homepage browser regression
        env:
          CHRONICLE_E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/chronicle-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          pnpm test:e2e:mobile-nav
          pnpm test:e2e:oauth-mock-browser
          pnpm test:e2e:web-share-target
          pnpm test:e2e:document-export
          pnpm test:e2e:shared-story-voice-isolation
          node e2e/dark-mode-home-validation.mjs
